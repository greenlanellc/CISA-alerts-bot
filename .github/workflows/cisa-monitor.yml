name: CISA Advisory Monitor

on:
  schedule:
    # Run every 6 hours at minute 0
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CISA Advisory Monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_ENABLED: ${{ secrets.SLACK_ENABLED || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED || 'false' }}
          SCAN_LIMIT: ${{ vars.SCAN_LIMIT || '10' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          NODE_ENV: production
        run: npx tsx src/index.ts

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed-advisories.json
          git diff --cached --quiet || git commit -m "chore: update processed advisories state [skip ci]"
          git push
